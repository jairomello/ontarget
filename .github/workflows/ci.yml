name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Testes de unidade e contrato
        run: bun test

      - name: Instalar Chromium do Playwright
        run: bunx playwright install --with-deps chromium

      - name: Testes end-to-end
        run: bun run test:e2e

      - name: Cobertura (informativo; alvo ≥ 90% em packages/core)
        run: bun test --coverage --coverage-reporter=text
        continue-on-error: true

      - name: Artefatos de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
